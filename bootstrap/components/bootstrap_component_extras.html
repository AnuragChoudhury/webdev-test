<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <!--This tag discriminates between mobile phone's physical resolution and displayable resolution-->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <!--The integrity attribute-->
    <!--The integrity attribute allows a browser to check the fetched script to ensure that the code is never loaded if the source has been manipulated. The webpage holds the hash and the server holds the file (the .js file in this case). The browser downloads the file, then checks it, to make sure that it is a match with the hash in the integrity attribute-->
    <!--
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">

    <style>
      [data-custom-attribute]{
        background-color: aqua;
      }
    </style>

    <title>Extras !!!</title>
  </head>
  <body>
    <h1>Extras</h1>
    
    <!-- Example element with an ID -->
    <div id="id1">
      This is an element with the ID "id1".
    </div>

    <div id="id2">
      This is an element with the ID "id2".
    </div>
    
    <!-- Example element with a custom attribute using JavaScript -->
    <div data-custom-attribute="#id2" id="elementWithCustomAttribute">
      This element has a custom attribute <kbd>data-custom-attribute</kbd>referencing the ID "id1".
    </div>

    <br>
    <button type="button" class="btn btn-primary" id="b1">
      Press me
    </button>

    <br><br><br>
    <!--Back button-->
    <a href="../../bootstrap/bootstrap_learning_home.html" style="display: inline;">
      <img src="../../all_images/back_button.png" style="width: 50px; background-color: transparent;">
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous">

    </script>

    <script>
      // Example starter JavaScript for disabling form submissions if there are invalid fields
(() => {
  'use strict'

  // Fetch all the forms we want to apply custom Bootstrap validation styles to
  const forms = document.querySelectorAll('.needs-validation')

  // Loop over them and prevent submission
  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }

      form.classList.add('was-validated')
    }, false)
  })
})()
    </script>

    <script>
      var h = document.getElementById("b1");
      h.addEventListener("click",(event)=>{
        //alert("Button Pressed")
        var allElements = document.getElementsByTagName("*");
        var count = allElements.length;
        for (var i=0; i < count; i++) {
          let answer = allElements[i].hasAttribute("data-custom-attribute");
          if(answer==true){
            var attrval = allElements[i].getAttribute('data-custom-attribute');
            var referencedElement = document.querySelector(attrval);

            //Calculating a random color
            var rand1 = Math.floor(Math.random() * 255).toString();
            var rand2 = Math.floor(Math.random() * 255).toString();
            var rand3 = Math.floor(Math.random() * 255).toString();
            rgbColor = "rgb(" + rand1 + "," + rand2 + "," + rand3 + ")";
            
            //Assigning a random color
            referencedElement.style.color = rgbColor;
            //alert(referencedElement);
          }
        }
      },true);
    </script>
  </body>
</html>
